name: Build Apple silicon Mac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the project virtualenv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"

      - name: Build
        run: ./scripts/build-mac.sh

      - name: Name the disk image
        run: cp dist/Runner.dmg dist/Runner-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-macos-arm64
          path: dist/Runner-arm64.dmg

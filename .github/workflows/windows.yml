name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build
        run: .\scripts\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-windows-x64
          path: dist/Runner.exe

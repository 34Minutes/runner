name: Release

# Push a version tag (for example 1.0.11) to publish a release:
#   git tag -a 1.0.11 -m 1.0.11 && git push origin 1.0.11
# The tag must match the version in pyproject.toml and src/runner/__init__.py,
# and CHANGELOG.md must have a "## [1.0.11]" section. Lint, tests, and both
# builds run from the tagged commit, then the release is created with the
# changelog section as its notes and the Windows and Linux files attached.
#
# Starting it from the Actions tab is a dry run for the version in
# pyproject.toml: everything runs except publishing.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag, pyproject.toml, __init__.py, and CHANGELOG.md agree
        id: check
        env:
          # A dry run from the Actions tab checks the version in pyproject.toml.
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            version=$(python3 scripts/check_version.py --tag "$TAG")
          else
            project=$(python3 scripts/check_version.py)
            version=$(python3 scripts/check_version.py --tag "$project")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tests:
    needs: check-version
    uses: ./.github/workflows/tests.yml

  windows:
    needs: check-version
    uses: ./.github/workflows/windows.yml

  linux:
    needs: check-version
    uses: ./.github/workflows/linux-x64.yml

  publish:
    needs: [check-version, tests, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build attestations: proof that a file came from this workflow.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Name the files and write the notes
        env:
          TAG: ${{ needs.check-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir release
          cp artifacts/Runner-windows-x64/Runner.exe "release/Runner-$TAG-windows-x64.exe"
          cp artifacts/Runner-linux-x64/Runner "release/Runner-$TAG-linux-x64"
          chmod +x "release/Runner-$TAG-linux-x64"
          (cd release && sha256sum Runner-* > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          # The CHANGELOG section for this version, headings one level down.
          {
            echo "### $TAG"
            awk -v head="## [$TAG]" '
              index($0, head) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { sub(/^### /, "#### "); print }
            ' CHANGELOG.md
            echo
            echo "#### Verify a download"
            echo "Compare its SHA-256 with \`SHA256SUMS.txt\`, or check it was built by this repository's release workflow:"
            echo
            echo '```'
            echo "gh attestation verify Runner-$TAG-windows-x64.exe --repo $REPO"
            echo '```'
          } > notes.md
          cat notes.md
          ls -l release

      # A dry run attests too, so this step is tested before a real release.
      - name: Attest the files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/Runner-*

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag

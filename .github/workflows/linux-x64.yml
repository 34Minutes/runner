name: Build Linux x64

# Run it from the Actions tab, or from the Release workflow for a version tag.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # Ubuntu 22.04 has glibc 2.35. A binary built here runs on that release
    # and on newer glibc distros. ubuntu-latest is newer and would shut out
    # Ubuntu 22.04 and other current desktops.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install desktop libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libice6 \
            libsm6 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxi6 \
            libxkbcommon-x11-0 \
            libxkbcommon0

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build
        run: ./scripts/build-linux.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Runner-linux-x64
          path: dist/Runner

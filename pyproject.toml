[project]
name = "script-runner"
version = "1.0.1b1"
description = "A lightweight, always-on-top single launcher for scripts and applications (macOS + Windows)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Script Runner Contributors"}
]
dependencies = [
    "PySide6>=6.6.0",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "nuitka; platform_system != 'Darwin'",  # Nuitka better on Windows/Linux for size
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
script-runner = "script_runner.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"script_runner" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[project]
name = "runner"
version = "2.1.0"
description = "A lightweight, always-on-top single launcher for scripts and applications (macOS + Windows)."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.txt"]
authors = [
  {name = "34minutespast12"}
]
# Exact versions, so every build gets the Qt that was tested. Update them on
# purpose: change the number, run the tests, then build.
dependencies = [
    # Essentials holds QtCore, QtGui, QtWidgets, QtNetwork, and QtDBus. The
    # PySide6 package adds about 175 MB of Addons, WebEngine, and Pdf that
    # Runner never imports.
    "PySide6-Essentials==6.12.0",
    "platformdirs==4.14.6",
]

[project.optional-dependencies]
# What the tests and the lint check need. The test workflow installs only this.
test = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "ruff==0.17.5",
]
dev = [
    "runner[test]",
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.10",
    "nuitka; platform_system != 'Darwin'",  # optional; the builds use PyInstaller
]

[project.scripts]
runner = "runner.main:main"
runner-ctl = "runner.ctl:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"runner" = ["assets/*", "ctl_guide.md", "help.md", "templates/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ even when it is not pip-installed in the venv.
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes, bugbear, pyupgrade, and simplify checks.
select = ["F", "B", "UP", "SIM"]
